    const openBtn = document.getElementById('ai-tool-picker-open');
    const backdrop = document.getElementById('ai-tool-picker-backdrop');
    const modal = document.getElementById('ai-tool-picker-modal');
    const closeBtn = document.getElementById('ai-tool-picker-close');
    const bodyEl = document.getElementById('ai-picker-body');
    const backBtn = document.getElementById('ai-picker-back');
    const restartBtn = document.getElementById('ai-picker-restart');
    const progressBar = document.getElementById('ai-picker-progress-bar');
    const subEl = document.getElementById('ai-picker-sub');

    let stack = ['start'];
    let lastFocus = null;

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function progressPct() {
        const depth = stack.length;
        if (depth <= 1) return 12;
        const node = nodes[stack[stack.length - 1]];
        if (node && node.kind === 'result') return 100;
        return Math.min(88, 12 + depth * 18);
    }

    function renderQuestion(node) {
        subEl.textContent = 'Tap an option to continue.';
        let html = '<p class="ai-picker-question">' + escapeHtml(node.text) + '</p><div class="ai-picker-pills" role="group" aria-label="Options">';
        node.options.forEach(function (opt, i) {
            html += '<button type="button" class="ai-picker-pill" data-next="' + escapeHtml(opt.next) + '" data-index="' + i + '">' + escapeHtml(opt.label) + '</button>';
        });
        html += '</div>';
        bodyEl.innerHTML = html;
        bodyEl.querySelectorAll('.ai-picker-pill').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const next = btn.getAttribute('data-next');
                stack.push(next);
                render();
            });
        });
    }

    function renderResult(node) {
        subEl.textContent = 'Suggested tools from this resource page.';
        let html = '<div class="ai-picker-result"><h3>' + escapeHtml(node.title) + '</h3>';
        html += '<p class="ai-picker-task">' + escapeHtml(node.task) + '</p><ul class="ai-picker-tool-list">';
        node.tools.forEach(function (tool) {
            html += '<li>';
            if (tool.url) {
                html += '<a href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener" class="linkDecExt">' + escapeHtml(tool.name) + '</a>';
            } else {
                html += '<strong>' + escapeHtml(tool.name) + '</strong>';
            }
            if (tool.note) {
                html += '<span class="ai-picker-tool-note">' + escapeHtml(tool.note) + '</span>';
            }
            html += '</li>';
        });
        html += '</ul><p class="ai-picker-caveat">' + escapeHtml(node.caveat) + '</p></div>';
        bodyEl.innerHTML = html;
    }

    function render() {
        const id = stack[stack.length - 1];
        const node = nodes[id];
        if (!node) {
            stack = ['start'];
            return render();
        }
        progressBar.style.width = progressPct() + '%';
        backBtn.disabled = stack.length <= 1;
        if (node.kind === 'result') {
            renderResult(node);
        } else {
            renderQuestion(node);
        }
    }

    function openModal() {
        lastFocus = document.activeElement;
        stack = ['start'];
        render();
        backdrop.hidden = false;
        modal.hidden = false;
        backdrop.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        closeBtn.focus();
    }

    function closeModal() {
        backdrop.hidden = true;
        modal.hidden = true;
        backdrop.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
    restartBtn.addEventListener('click', function () {
        stack = ['start'];
        render();
    });
    backBtn.addEventListener('click', function () {
        if (stack.length > 1) {
            stack.pop();
            render();
        }
    });
    document.addEventListener('keydown', function (e) {
        if (modal.hidden) return;
        if (e.key === 'Escape') closeModal();
    });
})();
</script>
